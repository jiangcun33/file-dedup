[package]
name = "filededup"
version = "0.3.1"
description = "文件去重 - Windows 文件去重工具"
edition = "2021"

[lib]
name = "filededup_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
opener = "0.7"
dedup-core = { path = "../crates/dedup-core" }
